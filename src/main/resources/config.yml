
# ========================================
# SSchedules - Sistema Avanzado de Schedules
# ========================================

# Zona horaria del servidor (Usa el formato de Java TimeZone)
# Colombia: America/Bogota
# México: America/Mexico_City
# Argentina: America/Argentina/Buenos_Aires
# España: Europe/Madrid
#- actionbar! &b&l💎 Mensaje en la barra de acción
#- broadcast! &eMensaje para todos
#- delay! 5  # Espera 5 segundos
#- msg! NombreJugador &aHola!
#- title! &cTítulo Grande
#- subtitle! &eSubtítulo pequeño
#- kickall! &cServidor reiniciando
#- allPlayers! give [allPlayers] diamond 1
#- give [randomPlayer] diamond %rand/1-64%
#- give [randomPlayer] diamond 64
# Placeholders disponibles:
# %schedule_nombredelschedule%
timezone: America/Bogota

# Horario de exclusión para schedules continuos (sin día específico)
# Los schedules con días definidos (monday, tuesday, etc.) NO se ven afectados
# Los schedules continuos se pausarán en este rango de horas
# Formato: HH:MM-HH:MM (ejemplo: 00:00-06:00 pausará de medianoche a 6am)
# Dejar vacío "" para desactivar
exclude-times: ""

# ========================================
# MENSAJE DE JUGADORES INSUFICIENTES
# ========================================
insufficient-players-message:
  # Habilitar/deshabilitar el mensaje globalmente
  enabled: true
  
  # Tipo de mensaje: 'broadcast', 'actionbar', 'title', 'subtitle'
  # broadcast - Mensaje en el chat
  # actionbar - Mensaje en la barra de acción
  # title - Título grande en pantalla
  # subtitle - Subtítulo en pantalla
  type: broadcast
  
  # Mensaje cuando no hay suficientes jugadores
  # Placeholders disponibles:
  # {schedule} - Nombre del schedule
  # {current} - Jugadores actuales
  # {required} - Jugadores requeridos
  message: "&c&l⚠ &fEl evento &e{schedule} &fno se activó por falta de jugadores &8(&c{current}&7/&a{required}&8)"
  
  # Mensaje alternativo para actionbar (más corto)
  actionbar-message: "&c⚠ {schedule} &7cancelado &8• &c{current}&7/&a{required} jugadores"
  
  # Configuración para título/subtítulo
  title-main: "&c&l⚠ EVENTO CANCELADO ⚠"
  title-sub: "&f{schedule} &8• &c{current}&7/&a{required} jugadores"
  title-fade-in: 10
  title-stay: 70
  title-fade-out: 20

countdown-format:
  # Formatos disponibles:
  # {days} {d} - Días
  # {hours} {h} - Horas  
  # {minutes} {m} - Minutos
  # {seconds} {s} - Segundos
  # Usa & para colores legacy o &#RRGGBB para colores hex
  with-days: "&c{days}D &e{hours}H &a{minutes}M"
  with-hours: "&e{hours}H &a{minutes}M &7{seconds}S"
  with-minutes: "&a{minutes}M &7{seconds}S"
  with-seconds: "&7{seconds}S"
  executing: "&6⚡ Ejecutando..."
  disabled: "&cDeshabilitado"
  not-found: "&7No encontrado"
  no-schedule: "&7Sin programar"
  starting: "&eIniciando..."

